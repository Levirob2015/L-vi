<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Sendestudio Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Kopfleiste mit Ansichtswahl; darunter Studio (Seitenleiste + Arbeitsfläche) bzw. öffentliche Seite bzw. Feed.
   Farben und Schrift folgen dem echten Sendestudio, damit die Demo zeigt, wie es wirklich aussieht. */
:root {
  --bg: #f4f2ee; --flaeche: #ffffff; --flaeche2: #ece8e1; --text: #1c1a17; --leise: #6d675e;
  --linie: #ddd7cc; --akzent: #c2410c; --akzent-text: #ffffff; --rot: #dc2626; --gruen: #15803d;
  --ki: #6d28d9; --ki-linie: #8b5cf6; --pegel-a: #16a34a; --pegel-b: #eab308; --pegel-c: #dc2626;
  --schrift: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131210; --flaeche: #1e1c19; --flaeche2: #2a2723; --text: #f2eee7; --leise: #a39c90;
    --linie: #36322c; --akzent: #fb923c; --akzent-text: #1a0e05; --rot: #f87171; --gruen: #4ade80;
    --ki: #c4b5fd; --ki-linie: #a78bfa; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131210; --flaeche: #1e1c19; --flaeche2: #2a2723; --text: #f2eee7; --leise: #a39c90;
  --linie: #36322c; --akzent: #fb923c; --akzent-text: #1a0e05; --rot: #f87171; --gruen: #4ade80;
  --ki: #c4b5fd; --ki-linie: #a78bfa; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--schrift); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--flaeche); }
a { color: var(--akzent); }
h1 { font-size: 1.55rem; line-height: 1.2; margin: .1em 0 .4em; text-wrap: balance; }
h2 { font-size: 1.08rem; margin: 1.4em 0 .5em; text-wrap: balance; }
h3 { font-size: 1rem; margin: 1em 0 .4em; }
p { margin: .5em 0; }
.leise { color: var(--leise); }
.klein { font-size: .85rem; }
button, input, textarea, select { font: inherit; }
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }

.leiste { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--flaeche); border-bottom: 1px solid var(--linie);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.marke { font-weight: 800; display: flex; align-items: center; gap: 10px; }
.onair { font-size: .68rem; letter-spacing: .12em; padding: 3px 7px; border-radius: 4px; border: 2px solid var(--leise); color: var(--leise); }
.onair.an { border-color: var(--rot); background: var(--rot); color: #fff; animation: puls 1.2s infinite; }
@keyframes puls { 50% { opacity: .55; } }
.demo-etikett { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--leise); border: 1px dashed var(--leise); border-radius: 999px; padding: 1px 8px; }
.ansichten { display: flex; gap: 4px; background: var(--flaeche2); padding: 4px; border-radius: 12px; }
.ansichten button { border: 0; background: transparent; color: var(--text); padding: 6px 12px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: .92rem; }
.ansichten button[aria-selected="true"] { background: var(--flaeche); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.huelle { max-width: 1180px; margin: 0 auto; padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hinweis { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; font-size: .9rem; color: var(--leise); margin-bottom: 16px; }
.hinweis b { color: var(--text); }
.raster { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; }
@media (max-width: 760px) { .raster { grid-template-columns: minmax(0, 1fr); } }
.karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 14px; padding: 18px; }
.stapel { display: grid; gap: 14px; }

.liste { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
.liste button { width: 100%; text-align: left; border: 1px solid transparent; background: transparent; color: var(--text); padding: 9px 12px; border-radius: 10px; cursor: pointer; }
.liste button:hover { background: var(--flaeche2); }
.liste button.aktiv { background: var(--flaeche); border-color: var(--linie); }
.liste small { display: block; color: var(--leise); }

.knopf { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-weight: 600; font-size: .93rem;
  padding: 8px 14px; border-radius: 10px; border: 1px solid var(--linie); background: var(--flaeche2); color: var(--text); }
.knopf:hover { border-color: var(--leise); }
.knopf:disabled { opacity: .45; cursor: not-allowed; }
.knopf.primaer { background: var(--akzent); color: var(--akzent-text); border-color: transparent; }
.knopf.leicht { background: transparent; }
.knopf.aufnahme { background: var(--rot); color: #fff; border-color: transparent; }
.knopf.ki { background: transparent; color: var(--ki); border-color: var(--ki-linie); }
.knopf.klein { padding: 4px 10px; font-size: .84rem; }
.knopf.breit { width: 100%; }
.knoepfe { display: flex; flex-wrap: wrap; gap: 8px; }

.formular { display: grid; gap: 12px; }
.formular label, .feld { display: grid; gap: 4px; font-weight: 600; font-size: .88rem; }
input, textarea, select { font-weight: 400; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--linie); background: var(--bg); color: var(--text); width: 100%; accent-color: var(--akzent); }
textarea { resize: vertical; }
.zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .zwei { grid-template-columns: 1fr; } }

.kopf { display: flex; gap: 18px; align-items: flex-start; }
.wachsen { flex: 1; min-width: 0; }
@media (max-width: 560px) { .kopf { flex-direction: column; } }
.cover { width: 112px; height: 112px; border-radius: 12px; object-fit: cover; background: var(--flaeche2); flex: none; display: block; }
.etikett { display: inline-block; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; border: 1px solid currentColor; border-radius: 999px; padding: 1px 9px; color: var(--akzent); }
.etikett.online { color: var(--gruen); }
.etikett.entwurf { color: var(--leise); }
.chip { display: inline-flex; gap: 4px; align-items: center; font-size: .8rem; border: 1px dashed var(--leise); color: var(--leise); border-radius: 8px; padding: 1px 8px; }
button.chip { background: transparent; cursor: pointer; }
.chip.ki { border-color: var(--ki-linie); color: var(--ki); }

.folge { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; }
.folge h3 { margin: .15em 0; }
.folge .unten { grid-column: 1 / -1; }
@media (max-width: 640px) { .folge { grid-template-columns: minmax(0, 1fr); } }
audio { width: 100%; }
.bytes { font-family: var(--mono); font-size: .78rem; background: var(--flaeche2); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre; margin: 6px 0 0; }

.pult { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 22px; align-items: center; background: var(--flaeche2); border-radius: 12px; padding: 16px; }
.pult .knoepfe { grid-column: 1 / -1; }
@media (max-width: 640px) { .pult { grid-template-columns: minmax(0, 1fr); } }
.uhr { font-size: 2.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pegel { height: 10px; width: 220px; max-width: 100%; border-radius: 5px; background: var(--linie); overflow: hidden; margin: 6px 0; }
.pegel div { height: 100%; width: 0; background: linear-gradient(90deg, var(--pegel-a) 60%, var(--pegel-b) 80%, var(--pegel-c)); background-size: 220px 100%; transition: width 60ms linear; }
.regler { display: grid; gap: 6px; }
.regler label { display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; font-size: .88rem; }
.regler input { padding: 0; }
.pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.pad { border: 1px solid var(--linie); border-radius: 12px; padding: 14px 8px; background: var(--flaeche); cursor: pointer; font-weight: 700; color: var(--text); text-align: center; }
.pad small { display: block; font-weight: 400; color: var(--leise); }
.pad.laeuft { background: var(--akzent); color: var(--akzent-text); }
.pad.laeuft small { color: inherit; }
.kapitel-zeile { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 8px; margin-bottom: 6px; }
.vorschlaege { display: flex; flex-wrap: wrap; gap: 6px; }
.vorschlaege button { border: 1px dashed var(--ki-linie); background: transparent; color: var(--text); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: .9rem; }
.ki-status { font-size: .82rem; color: var(--ki); }

/* Öffentliche Seite: wie site.py */
.oeffentlich { max-width: 760px; margin: 0 auto; }
.oeffentlich .punkt { width: 11px; height: 11px; border-radius: 50%; background: var(--akzent); display: inline-block; }
.oeff-kopf { display: flex; align-items: center; gap: 10px; font-weight: 700; margin-bottom: 18px; }
.oeff-sendung { display: flex; gap: 18px; align-items: flex-start; }
@media (max-width: 560px) { .oeff-sendung { flex-direction: column; } .oeff-sendung .cover { width: 100%; height: auto; aspect-ratio: 1; max-width: 100%; } }
.kapitel { list-style: none; padding: 0; margin: 0; }
.kapitel li { border-top: 1px solid var(--linie); }
.kapitel button { width: 100%; border: 0; background: transparent; color: var(--text); display: flex; gap: 14px; padding: 8px 2px; cursor: pointer; text-align: left; }
.kapitel button:hover { color: var(--akzent); }
.kapitel .zeit { font-variant-numeric: tabular-nums; color: var(--leise); min-width: 4.5em; }
.live { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--akzent); }
.live::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; animation: puls 1.4s infinite; }
.programm li.laeuft { font-weight: 700; color: var(--akzent); }
pre.feed { font-family: var(--mono); font-size: .8rem; line-height: 1.45; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 12px; padding: 14px; overflow-x: auto; margin: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
/* Zeitung: wie Papier, auch im dunklen Modus */
.zeitung{--papier:#fbf8f1;--tinte:#151310;--grau:#5d574d;--strich:#1e1b17;
background:var(--papier);color:var(--tinte);padding:28px 30px 34px;border-radius:4px;
box-shadow:0 1px 3px rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.08);
font:16px/1.5 Georgia,"Times New Roman",Times,serif;text-align:left}
.zeitung *{color:inherit}
.zeitung .z-kopf{text-align:center;border-bottom:4px double var(--strich);padding-bottom:8px;margin-bottom:18px}
.zeitung .z-zeile{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
font:600 .78rem/1.3 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;
color:var(--grau);border-bottom:1px solid var(--strich);padding-bottom:6px}
.zeitung .z-name{font:900 clamp(2.1rem,7vw,4rem)/1 "Old English Text MT","UnifrakturMaguntia",
Georgia,"Times New Roman",serif;margin:12px 0 6px;letter-spacing:.01em;overflow-wrap:anywhere}
.zeitung .z-untertitel{font-style:italic;color:var(--grau);margin:0}
.zeitung article{margin:0 0 18px}
.zeitung .z-rubrik{font:700 .72rem/1.2 system-ui,sans-serif;letter-spacing:.12em;
text-transform:uppercase;color:#9a3412;margin:0 0 4px}
.zeitung h2{font:800 1.35rem/1.15 Georgia,"Times New Roman",serif;margin:0 0 6px;break-after:avoid}
.zeitung .z-unterzeile{font-style:italic;margin:0 0 6px;color:var(--grau);break-after:avoid}
.zeitung .z-autor{font:600 .78rem/1.3 system-ui,sans-serif;color:var(--grau);margin:0 0 8px}
.zeitung .z-text p{margin:0 0 .55em;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.zeitung .z-text p+p{text-indent:1.2em}
.zeitung figure{margin:0 0 10px;break-inside:avoid}
.zeitung figure img{display:block;width:100%;height:auto;border:1px solid #d6d0c4}
.zeitung figcaption{font:.78rem/1.35 system-ui,sans-serif;color:var(--grau);margin-top:4px}
.zeitung .z-aufmacher{border-bottom:1px solid var(--strich);padding-bottom:16px;margin-bottom:18px}
.zeitung .z-aufmacher h2{font-size:clamp(1.7rem,4.5vw,2.6rem);line-height:1.08}
.zeitung .z-aufmacher .z-unterzeile{font-size:1.12rem}
.zeitung .z-aufmacher .z-text{columns:3 15em;column-gap:22px;column-rule:1px solid #cfc8bb}
.zeitung .z-aufmacher .z-text p:first-child::first-letter{float:left;font-size:3.3em;
line-height:.8;padding:.06em .08em 0 0;font-weight:800}
.zeitung .z-spalten{columns:3 14em;column-gap:22px;column-rule:1px solid #cfc8bb}
.zeitung .z-spalten article{break-inside:avoid-column;border-bottom:1px solid #cfc8bb;padding-bottom:12px}
.zeitung .z-spalten article:last-child{border-bottom:0}
.zeitung .z-ende{border-top:4px double var(--strich);margin-top:6px;padding-top:6px;
font:.72rem/1.3 system-ui,sans-serif;color:var(--grau);text-align:center}
.zeitung .z-leer{color:var(--grau);font-style:italic;text-align:center}
.drucken-leiste{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.ausgaben{list-style:none;padding:0;margin:0}
.ausgaben li{border-top:1px solid var(--linie);padding:12px 0}
.ausgaben a{font-weight:700;font-size:1.1rem;color:var(--text);text-decoration:none}
.ausgaben a:hover{color:var(--akzent)}
@media (max-width:560px){.zeitung{padding:18px 14px 22px}}

/* Teleprompter */
.prompter-fenster { position: relative; height: 34vh; min-height: 200px; overflow: hidden; cursor: pointer; background: #0b0b0b; color: #f5f5f5; border-radius: 12px; }
.prompter-fenster::after { content: ""; position: absolute; left: 0; right: 0; top: 33%; border-top: 2px dashed rgba(251,146,60,.7); pointer-events: none; }
.prompter-text { padding: 11vh 6% 50vh; font-weight: 600; font-size: 30px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
.prompter-fenster.gespiegelt .prompter-text { transform: scaleX(-1); }
.prompter-fenster:fullscreen { height: 100vh; border-radius: 0; }
.prompter-fenster:fullscreen .prompter-text { padding-top: 33vh; font-size: 52px; }
.prompter-regler { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .9rem; }
.prompter-regler label { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.prompter-regler input[type=range] { width: 110px; padding: 0; }
details.sprech summary { cursor: pointer; font-weight: 700; }
details.sprech .text { white-space: pre-line; max-height: 50vh; overflow: auto; border-left: 3px solid var(--linie); padding-left: 12px; }
/* Zeitung */
.zeitung-raster { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; align-items: start; }
.zeitung-raster > div:last-child { position: sticky; top: 70px; max-height: calc(100vh - 80px); overflow: auto; }
@media (max-width: 1000px) { .zeitung-raster { grid-template-columns: minmax(0, 1fr); } .zeitung-raster > div:last-child { position: static; max-height: none; } }
.artikel { border: 1px solid var(--linie); border-radius: 12px; padding: 12px; display: grid; gap: 8px; background: var(--bg); }
.artikel-kopf { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.artikel label { display: grid; gap: 3px; font-weight: 600; font-size: .85rem; }
.artikel-bild { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.artikel-bild img { width: 110px; height: 70px; object-fit: cover; border-radius: 8px; border: 1px solid var(--linie); }
#druckbereich { display: none; }
@page { size: A4; margin: 12mm; }
@media print {
  body.druckt > *:not(#druckbereich) { display: none !important; }
  body.druckt #druckbereich { display: block; }
  body.druckt { background: #fff; }
  #druckbereich .zeitung { box-shadow: none; padding: 0; background: #fff; font-size: 10.5pt; }
  #druckbereich .z-name { font-size: 40pt; }
  #druckbereich .z-aufmacher .z-text, #druckbereich .z-spalten { columns: 3; column-gap: 6mm; }
  #druckbereich figure img { max-height: 90mm; object-fit: cover; }
}
@media (prefers-reduced-motion: reduce) { .onair.an, .live::before { animation: none; } .pegel div { transition: none; } }
</style>

<header class="leiste">
  <div class="marke"><span class="onair" id="onair">ON AIR</span> Sendestudio <span class="demo-etikett">Demo</span></div>
  <nav class="ansichten" role="tablist" aria-label="Ansicht">
    <button role="tab" id="tab-studio" aria-selected="true" data-ansicht="studio">Studio</button>
    <button role="tab" id="tab-seite" aria-selected="false" data-ansicht="seite">Öffentliche Seite</button>
    <button role="tab" id="tab-feed" aria-selected="false" data-ansicht="feed">Podcast-Feed</button>
    <button role="tab" id="tab-zeitung" aria-selected="false" data-ansicht="zeitung">📰 Zeitung</button>
  </nav>
</header>

<main class="huelle">
  <div class="hinweis">
    <span><b>Zum Ausprobieren.</b> Alles bleibt in diesem Browserfenster, neu laden setzt die Demo zurück.</span>
    <span id="ki-hinweis">KI-Texte: Beispielantworten</span>
    <a href="https://github.com/Levirob2015/L-vi/blob/claude/sendestudio/SENDESTUDIO.md" target="_blank" rel="noopener">Zum echten Programm ↗</a>
  </div>

  <section id="ansicht-studio" class="raster">
    <aside>
      <h2 style="margin-top:0">Sendungen</h2>
      <ul class="liste" id="sendungsliste"></ul>
      <button class="knopf primaer breit" id="neue-sendung">+ Neue Sendung</button>
    </aside>
    <div id="arbeit" class="stapel" style="min-width:0"></div>
  </section>

  <section id="ansicht-seite" hidden></section>
  <section id="ansicht-feed" hidden></section>
  <section id="ansicht-zeitung" hidden></section>
</main>

<div id="druckbereich" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------ Hilfen
  var $ = function (s, w) { return (w || document).querySelector(s); };
  function el(tag, attrs) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (k === "text") e.textContent = v;
      else if (k === "class") e.className = v;
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return e;
  }
  function zeit(s) {
    s = Math.max(0, Math.floor(s || 0));
    return Math.floor(s / 3600) + ":" + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }
  function zeitLesen(t) {
    var teile = String(t).trim().split(":").map(Number);
    if (teile.some(isNaN)) return NaN;
    return teile.reduce(function (a, b) { return a * 60 + b; }, 0);
  }
  function datum(ts) { return new Date(ts).toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" }); }
  function slug(t) {
    return (t || "folge").toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
      .normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "folge";
  }
  var toastUhr;
  function melden(t) {
    var x = $("#toast"); x.textContent = t; x.hidden = false;
    clearTimeout(toastUhr); toastUhr = setTimeout(function () { x.hidden = true; }, 3200);
  }
  var ARTEN = { podcast: "Podcast", radio: "Radio", doku: "Dokumentation" };
  var KI_NAMEN = { text: "Text", stimme: "Stimme", bild: "Bilder", musik: "Musik", video: "Video" };

  // ------------------------------------------------------------ Ton erzeugen (ohne Mikrofon)
  var ctx = null;
  function audio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
