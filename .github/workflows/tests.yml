# Fuehrt die Testsuite bei jedem Push und jedem Pull Request aus.
#
# Der Anlass war ein konkreter Fehler: Die Wartung - und damit die Wache
# ueber die Firewall-Regeln, die Dateiwache und die Anomalie-Auswertung -
# lief im haeufigsten Einsatzfall gar nicht. Aufgefallen ist das erst beim
# Durchlesen von Hand. Tests, die niemand ausfuehrt, finden so etwas nicht.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 ist die aelteste unterstuetzte Fassung (siehe pyproject.toml),
        # 3.13 die neueste. Beide Enden muessen gruen sein.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Abhaengigkeiten installieren
        # Das Paket selbst hat keine - nur pytest und PyYAML fuer die Tests.
        # Das Anthropic-SDK ist optional (KI-Texte im Sendestudio) und braucht
        # Python 3.10+; auf 3.9 werden diese Tests uebersprungen.
        run: |
          python -m pip install --upgrade pip pytest PyYAML
          python -c "import sys; sys.exit(sys.version_info < (3, 10))" && python -m pip install "anthropic>=1.15" || true

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Laeuft ohne PyYAML genauso?
        # PyYAML ist optional. Faellt es weg, muss die JSON-Konfiguration
        # weiterhin funktionieren - sonst ist "keine Abhaengigkeiten" eine
        # leere Behauptung.
        run: |
          python -m pip uninstall -y PyYAML
          python -m pytest tests/ -q

  ohne-fremde-pakete:
    # Prueft die zentrale Zusage des Projekts: Das Paket selbst kommt mit
    # der Standardbibliothek aus.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Nur Standardbibliothek?
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          stdlib = set(sys.stdlib_module_names)
          erlaubt = {"yaml", "anthropic"}  # optional, wird abgefangen
          eigene = {"loginshield", "sendestudio"}  # die Pakete dieses Repositorys
          fremd = set()
          dateien = [p for paket in ("loginshield", "sendestudio")
                     for p in pathlib.Path(paket).rglob("*.py")]
          for pfad in dateien:
              for knoten in ast.walk(ast.parse(pfad.read_text())):
                  if isinstance(knoten, ast.Import):
                      namen = [n.name for n in knoten.names]
                  elif isinstance(knoten, ast.ImportFrom) and knoten.level == 0:
                      namen = [knoten.module or ""]
                  else:
                      continue
                  for name in namen:
                      wurzel = name.split(".")[0]
                      if wurzel and wurzel not in stdlib | erlaubt | eigene:
                          fremd.add(f"{wurzel} (in {pfad})")
          if fremd:
              print("Fremde Pakete gefunden:")
              for eintrag in sorted(fremd):
                  print(" -", eintrag)
              raise SystemExit(1)
          print("Nur Standardbibliothek.")
          PY

      - name: Laesst sich installieren und starten?
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          loginshield --version
          loginshield doctor --json > /dev/null
          sendestudio --version
          cd "$(mktemp -d)" && sendestudio init --titel CI > /dev/null && sendestudio export

  installation:
    # Das Installationsskript fuer den eigenen Server - ohne apt und systemd,
    # aber mit allem anderen: Programm, Einstellungen, Rechte, Update-Lauf.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Erste Einrichtung
        run: |
          ziel="$(mktemp -d)"
          echo "ZIEL=$ziel" >> "$GITHUB_ENV"
          bash deploy/install.sh --ohne-dienste --praefix "$ziel" --domain radio.example.test --titel CI | tee ausgabe.txt
          grep -q "Studio-Passwort: " ausgabe.txt
          test "$(stat -c %a "$ziel/var/lib/sendestudio/sendestudio.json")" = 600
          test "$(stat -c %a "$ziel/etc/sendestudio/umgebung")" = 600
      - name: Zweiter Lauf aktualisiert nur
        run: |
          bash deploy/install.sh --ohne-dienste --praefix "$ZIEL" --domain radio.example.test | tee ausgabe.txt
          grep -q "Vorhandene Einrichtung gefunden" ausgabe.txt
          if grep -q "Studio-Passwort: " ausgabe.txt; then echo "Passwort neu erzeugt?!"; exit 1; fi
      - name: Die installierte Website startet
        run: |
          cd "$ZIEL/var/lib/sendestudio"
          "$ZIEL/opt/sendestudio/bin/sendestudio" -c sendestudio.json serve &
          sleep 3
          curl -sf http://127.0.0.1:8790/ | grep -q "Roboter-Designer"
          curl -sf http://127.0.0.1:8790/roboter/ | grep -q "ProBot"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8790/leitstand/)" = 401
      - name: Caddy-Einstellungen gueltig
        run: |
          curl -sL "https://github.com/caddyserver/caddy/releases/download/v2.6.2/caddy_2.6.2_linux_amd64.tar.gz" | tar xz caddy
          sed -e "s/radio.example.de/radio.example.test/g" deploy/Caddyfile > Caddyfile.test
          ./caddy validate --config Caddyfile.test --adapter caddyfile
